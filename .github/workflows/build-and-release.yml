name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      
      - name: Build
        run: npm run build
      
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create dist archive
        run: |
          cd dist
          tar -czf ../n8n-opencode-node-v${{ steps.version.outputs.VERSION }}.tar.gz .
          cd ..
      
      - name: Configure git
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "OpenCode Bot"
          git config user.email "bot@opencode.ai"
      
      - name: Create and push tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG="v${VERSION}"
          
          # Check if tag exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG="v${VERSION}"
          
          # Create release using gh CLI (should be installed by default)
          if ! command -v gh &> /dev/null; then
            echo "gh CLI not found, installing..."
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install gh
          fi
          
          gh release create "$TAG" \
            "n8n-opencode-node-v${VERSION}.tar.gz" \
            --repo "${{ github.repository }}" \
            --title "Release v${VERSION}" \
            --notes "## Installation

Download and extract the \`n8n-opencode-node-v${VERSION}.tar.gz\` file.

See [GITHUB_RELEASES.md](https://github.com/hlavrencic/n8n-nodes-opencode/blob/main/GITHUB_RELEASES.md) for installation instructions." \
            || echo "Release already exists"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
