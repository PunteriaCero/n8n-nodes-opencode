name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      
      - name: Lint code
        run: npm run lint --if-present
      
      - name: Run tests
        run: npm run test
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      
      - name: Build
        run: npm run build
      
      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create dist archive
        run: |
          cd dist
          tar -czf ../n8n-opencode-node-v${{ steps.version.outputs.VERSION }}.tar.gz .
          cd ..
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Installation
            
            1. Download `n8n-opencode-node-v${{ steps.version.outputs.VERSION }}.tar.gz` from this release
            2. Extract to your n8n custom nodes directory:
               - On CasaOS: `/DATA/AppData/n8n/`
               - On Docker: `/home/node/.n8n/nodes/`
               - Locally: `~/.n8n/nodes/`
            3. Restart n8n
            
            ## What's new
            Check [CHANGELOG.md](https://github.com/hlavrencic/n8n-nodes-opencode/blob/main/CHANGELOG.md) for details.
          files: |
            n8n-opencode-node-v${{ steps.version.outputs.VERSION }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
