name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      
      - name: Build
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      
      - name: Build
        run: npm run build
      
      - name: Get version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create dist archive
        run: |
          cd dist
          tar -czf ../n8n-opencode-node-v${{ steps.version.outputs.VERSION }}.tar.gz .
          cd ..
      
      - name: Create GitHub Release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          
          # Check if tag already exists
          git tag "$TAG" || true
          git push origin "$TAG" || true
          
          # Create release using GitHub CLI
          gh release create "$TAG" \
            "n8n-opencode-node-v${VERSION}.tar.gz" \
            --title "Release ${TAG}" \
            --notes "## Installation

Download and extract the \`n8n-opencode-node-v${VERSION}.tar.gz\` file.

See [GITHUB_RELEASES.md](https://github.com/hlavrencic/n8n-nodes-opencode/blob/main/GITHUB_RELEASES.md) for installation instructions." \
            || echo "Release already exists"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
