name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --ignore-scripts --legacy-peer-deps
      
      - name: Build
        run: npm run build
      
      - name: Get version
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Create dist archive
        run: |
          cd dist
          tar -czf ../n8n-opencode-node-v${{ steps.version.outputs.VERSION }}.tar.gz .
          cd ..
      
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG="v${VERSION}"
          
          # Create annotated tag
          git tag -a "$TAG" -m "Release $TAG" || git tag -d "$TAG" && git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG" || true
          
          # Create release using GitHub API
          curl -X POST https://api.github.com/repos/${{ github.repository }}/releases \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"Release $TAG\",
              \"body\": \"## Installation\n\nDownload and extract the \\\`n8n-opencode-node-v${VERSION}.tar.gz\\\` file.\n\nSee [GITHUB_RELEASES.md](https://github.com/hlavrencic/n8n-nodes-opencode/blob/main/GITHUB_RELEASES.md) for installation instructions.\",
              \"draft\": false,
              \"prerelease\": false
            }" || echo "Release might already exist"
      
      - name: Upload release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          TAG="v${VERSION}"
          RELEASE_ID=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" | jq '.id')
          
          curl -X POST "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary @"n8n-opencode-node-v${VERSION}.tar.gz" || echo "Asset might already exist"
